# FINAL CLOUDBUILD.YAML (with logging fix)
# This file defines the automated steps for building and deploying your application.

steps:
  # Step 1: Build the container image from the 'backend' directory
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'backend'
    args: ['build', '-t', 'gcr.io/${PROJECT_ID}/video-generator:${SHORT_SHA}', '.']

  # Step 2: Push the new image to Google's Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'backend'
    args: ['push', 'gcr.io/${PROJECT_ID}/video-generator:${SHORT_SHA}']

  # Step 3: Deploy the new image version to Cloud Run with all configurations
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'video-generator-service'
      - '--image'
      - 'gcr.io/${PROJECT_ID}/video-generator:${SHORT_SHA}'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'video-generator-sa@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--cpu'
      - '4'
      - '--memory'
      - '8Gi'
      - '--timeout'
      - '3600'
      - '--update-secrets=GOOGLE_APPLICATION_CREDENTIALS_JSON=google-creds-json:latest,FIREBASE_CREDENTIALS_JSON=firebase-creds-json:latest,GEMINI_API_KEY=gemini-api-key:latest,FLASK_SECRET_KEY=flask-secret-key:latest'
      - '--set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},FIREBASE_STORAGE_BUCKET=genteach-5c341.firebasestorage.app'

# Specifies the final image to be stored in the build artifacts for traceability.
images:
  - 'gcr.io/${PROJECT_ID}/video-generator:${SHORT_SHA}'

# ADD THIS NEW SECTION AT THE END 
# This option explicitly sets the logging mode to solve the permission error.
options:
  logging: CLOUD_LOGGING_ONLY
